            echo "branch=$GITHUB_HEAD_REF" >> $GITHUB_OUTPUT
          else
            echo "branch=$GITHUB_REF_NAME" >> $GITHUB_OUTPUT
          fi

      - name: Checkout repository [libbitcoin-system]
        id: checkout-libbitcoin-system
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          path: 'libbitcoin-system'
          repository: ${{ github.repository }}


      - name: Prepare toolchain [linux]
        if: ${{ startsWith(matrix.image, 'ubuntu') }}
        shell: bash
        run: |
          sudo apt-get update
          if [[ "${{ matrix.package }}" == *"g++-15"* ]] ||
             [[ "${{ matrix.package }}" == *"gcc-15"* ]] ||
             [[ "${{ matrix.package }}" == *"g++-16"* ]] ||
             [[ "${{ matrix.package }}" == *"gcc-16"* ]] ||
             [[ "${{ matrix.package }}" == *"gcc-15-multilib"* ]] ||
             [[ "${{ matrix.package }}" == *"g++-15-multilib"* ]]; then
            sudo add-apt-repository ppa:ubuntu-toolchain-r/test -y
            sudo apt-get update
          fi
          sudo apt-get install git build-essential autoconf automake libtool pkg-config ${{ matrix.package || '' }}
          if [[ "${{ matrix.coverage }}" == "lcov" ]]; then
              sudo apt-get install lcov
          fi

      - name: Prepare toolchain [macos]
        if: ${{ startsWith(matrix.image, 'macos') }}
        shell: bash
        run: |
          brew install autoconf automake libtool ${{ matrix.package || '' }}
          if [[ -n "${{ matrix.llvm }}" ]]; then
              echo "PATH=/opt/homebrew/opt/${{ matrix.llvm }}/bin:${PATH}" >> $GITHUB_ENV
          fi

      - name: Prepare toolchain [windows]
        if: ${{ startsWith(matrix.image, 'windows') }}
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

      - name: Environmental Computation
        shell: bash
        run: |
          if [[ "${{ matrix.link }}" == "dynamic" ]]; then
              echo "LDFLAGS=-Wl,-rpath,${{ github.workspace }}/prefix/lib" >> $GITHUB_ENV
          fi

      - name: Prepare sysroot [cross]
        if: ${{ matrix.sysroot }}
        shell: bash
        run: |
          mkdir -p /tmp/sysroot
          set -- ${{ matrix.sysroot }}
          while [[ $# -gt 1 ]]; do
            curl --fail --silent --show-error --location --output sysroot.archive "$1"
            echo "$2  sysroot.archive" | sha256sum --check
            tar -xf sysroot.archive -C /tmp/sysroot
            rm sysroot.archive
            shift 2
          done
          chmod -R u+rwX /tmp/sysroot
          find /tmp/sysroot -name '*.la' -delete

      - name: Verify emulation [cross]
        if: ${{ matrix.host }}
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          echo 'int main() { return 0; }' > emulation.c
          ${{ matrix.cc }} ${{ matrix.flags }} emulation.c -o emulation
          file emulation
          if [[ "${{ matrix.options }}" != *"--build-skip-tests"* &&   "${{ matrix.options }}" != *"--build-skip-test-run"* ]]; then
            ./emulation
          fi

      - name: Execute installation
        shell: bash
        working-directory: 'libbitcoin-system'
        env:
          MAKEFLAGS: "${{ matrix.host && 'TESTS=' || '' }}"
        run: >
          ./builds/gnu/install-gnu.sh
          --build-use-local-src
          --build-src-dir="${{ github.workspace }}"
          --prefix="${{ github.workspace }}/prefix"
          ${{ !matrix.host && '--build-post-install-clean' || '' }}
          --build-obj-dir="obj"
          --build-obj-dir-relative
          --build-config="${{ matrix.config }}"
          --build-link="${{ matrix.link }}"
          ${{ matrix.libsecp256k1 }}
          ${{ matrix.options }}
          ${{ matrix.host && format('--host={0}', matrix.host) || '' }}

      - name: Execute tests [cross]
        if: ${{ matrix.host && !contains(matrix.options, '--build-skip-test') }}
        shell: bash
        working-directory: 'libbitcoin-system/obj/builds/gnu'
        run: >
          ./test/libbitcoin-system-test
          --log_level=test_suite
          --report_level=short
          --show_progress=no
          --detect_memory_leak=0
          --build_info=yes

      - name: Coverage calculation
        if: ${{ matrix.coverage == 'lcov' }}
        shell: bash
        working-directory: 'libbitcoin-system'
        run: |
          lcov --ignore-errors version,gcov,mismatch,mismatch --directory . --capture --output-file coverage.info
          lcov --ignore-errors unused --extract coverage.info "${{ github.workspace }}/libbitcoin-system/include/*" "${{ github.workspace }}/libbitcoin-system/src/*" --output-file coverage.info
          lcov --ignore-errors unused --remove coverage.info "${{ github.workspace }}/libbitcoin-system/src/words/catalogs/*" "${{ github.workspace }}/libbitcoin-system/src/crypto/secp256k1/cuda/*" --output-file coverage.info

      - name: Coveralls.io upload
        if: ${{ matrix.coverage == 'lcov' }}
        shell: bash
        working-directory: 'libbitcoin-system'
        env:
          COVERALLS_REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -sLO https://github.com/coverallsapp/coverage-reporter/releases/latest/download/coveralls-linux-x86_64.tar.gz
          curl -sLO https://github.com/coverallsapp/coverage-reporter/releases/latest/download/coveralls-checksums.txt
          grep -F coveralls-linux-x86_64.tar.gz coveralls-checksums.txt | sha256sum -c
          tar -xzf coveralls-linux-x86_64.tar.gz
          ./coveralls report --format lcov coverage.info

      - name: Test artifact collection
        if: failure()
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          if [[ -e "libbitcoin-system/obj/Testing/Temporary/LastTest.log" ]]; then
            cp "libbitcoin-system/obj/Testing/Temporary/LastTest.log" libbitcoin-system-LastTest.errors
          fi
          if [[ -e "libbitcoin-system/obj/test-suite.log" ]]; then
            cp "libbitcoin-system/obj/test-suite.log" libbitcoin-system-test-suite.errors
          fi
          if [[ -e "libbitcoin-system/obj/test.log" ]]; then
            cp "libbitcoin-system/obj/test.log" libbitcoin-system-test.errors
          fi

      - name: Test artifact upload
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: testlogs
          path: ${{ github.workspace }}/*.errors
          retention-days: 1
          if-no-files-found: warn

  musl:
    if: github.event_name != 'pull_request' || github.event.action != 'closed'

    strategy:
      fail-fast: false

      matrix:
        include:
          - image: ubuntu-24.04
            config: "release"
            link: "static"
            cc: "gcc"
            cxx: "g++"
            flags: ""
            coverage: ""
            options: "--enable-isystem"

    runs-on: ${{ matrix.image }}
    container:
      image: alpine:3.24
      volumes:
        - ${{ github.workspace }}:${{ github.workspace }}

    env:
      CC: '${{ matrix.cc }}'
      CXX: '${{ matrix.cxx }}'
      CFLAGS: '${{ matrix.flags }}'
      CXXFLAGS: '${{ matrix.flags }}'

    steps:
      - name: Prepare toolchain [alpine]
        shell: sh
        run: |
          apk add --no-cache bash git build-base autoconf automake libtool pkgconf linux-headers ${{ matrix.package || '' }}

      - name: Get branch name
        id: get-branch
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" == "pull_request" ]; then

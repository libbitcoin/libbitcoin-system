name: Expanded Continuous Integration

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.repository_owner == 'libbitcoin' && (github.event.pull_request.number || github.run_id) || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  information:
    runs-on: ubuntu-latest

    env:
      CONCURRENCY_GROUP: ${{ github.workflow }}-${{ github.repository_owner == 'libbitcoin' && (github.event.pull_request.number || github.run_id) || github.ref }}

    steps:
        - name: state
          run: |
            echo "group    : $CONCURRENCY_GROUP"
            echo "owner    : ${{ github.repository_owner }}"
            echo "pr       : ${{ github.event.pull_request }}"
            echo "pr #     : ${{ github.event.pull_request.number }}"
            echo "run_id   : ${{ github.run_id }}"
            echo "ref      : ${{ github.ref }}"
            echo "base_ref : ${{ github.base_ref }}"
            echo "head_ref : $GITHUB_HEAD_REF"


  gnu:
    if: github.event_name != 'pull_request' || github.event.action != 'closed'

    strategy:
      fail-fast: false

      matrix:
        include:
          - image: macos-latest
            config: "debug"
            link: "dynamic"
            cc: "clang"
            cxx: "clang++"
            flags: ""
            coverage: ""
            libsecp256k1: ""
            options: "--enable-isystem"


name: Continuous Integration

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths:
      - 'builds/cmake/**'
      - 'builds/gnu/**'
      - 'builds/msvc/**'
      - 'console/**'
      - 'include/**'
      - 'src/**'
      - 'test/**'
  push:
    branches:
      - '**'
    tags-ignore:
      - '**'
    paths:
      - 'builds/cmake/**'
      - 'builds/gnu/**'
      - 'builds/msvc/**'
      - 'console/**'
      - 'include/**'
      - 'src/**'
      - 'test/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.repository_owner == 'libbitcoin' && (github.event.pull_request.number || github.run_id) || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  information:
    runs-on: ubuntu-latest

    env:
      CONCURRENCY_GROUP: ${{ github.workflow }}-${{ github.repository_owner == 'libbitcoin' && (github.event.pull_request.number || github.run_id) || github.ref }}

    steps:
        - name: state
          run: |
            echo "group    : $CONCURRENCY_GROUP"
            echo "owner    : ${{ github.repository_owner }}"
            echo "pr       : ${{ github.event.pull_request }}"
            echo "pr #     : ${{ github.event.pull_request.number }}"
            echo "run_id   : ${{ github.run_id }}"
            echo "ref      : ${{ github.ref }}"
            echo "base_ref : ${{ github.base_ref }}"
            echo "head_ref : $GITHUB_HEAD_REF"


  gnu:
    if: github.event_name != 'pull_request' || github.event.action != 'closed'

    strategy:
      fail-fast: false

      matrix:
        include:
          - image: macos-latest
            config: "release"
            link: "static"
            cc: "clang"
            cxx: "clang++"
            flags: ""
            coverage: ""
            secp256k1: ""
            options: "--enable-isystem"

          - image: ubuntu-24.04
            config: "release"
            link: "dynamic"
            cc: "clang-18"
            cxx: "clang++-18"
            flags: ""
            coverage: ""
            secp256k1: "--build-secp256k1"
            options: "--enable-isystem --with-secp256k1"

          - image: ubuntu-24.04
            config: "debug"
            link: "dynamic"
            cc: "clang-19"
            cxx: "clang++-19"
            flags: ""
            coverage: ""
            package: "clang-19 clang++-19"
            secp256k1: ""
            options: "--enable-isystem"

          - image: ubuntu-24.04
            config: "debug"
            link: "static"
            cc: "gcc-13"
            cxx: "g++-13"
            flags: "--coverage -fprofile-update=atomic -fno-inline"
            coverage: "lcov"
            secp256k1: ""
            options: "--enable-isystem"

          - image: ubuntu-24.04
            config: "debug"
            link: "static"
            cc: "s390x-linux-gnu-gcc"
            cxx: "s390x-linux-gnu-g++"
            flags: ""
            coverage: ""
            package: "gcc-s390x-linux-gnu g++-s390x-linux-gnu qemu-user-static"
            host: "s390x-linux-gnu"
            secp256k1: ""
            options: "--enable-isystem --build-skip-test-run"

          - image: macos-26-intel
            config: "release"
            link: "static"
            cc: "clang"
            cxx: "clang++"
            flags: ""
            coverage: ""
            secp256k1: ""
            options: "--enable-isystem"

          - image: ubuntu-24.04-arm
            config: "release"
            link: "static"
            cc: "gcc-14"
            cxx: "g++-14"
            flags: ""
            coverage: ""
            package: "gcc-14 g++-14"
            secp256k1: ""
            options: "--enable-isystem"

          - image: ubuntu-24.04
            config: "release"
            link: "static"
            cc: "gcc-15"
            cxx: "g++-15"
            flags: "-m32"
            coverage: ""
            package: "gcc-15-multilib g++-15-multilib"
            secp256k1: ""
            options: "--enable-isystem"

          - image: ubuntu-24.04
            config: "debug"
            link: "static"
            cc: "arm-linux-gnueabihf-gcc"
            cxx: "arm-linux-gnueabihf-g++"
            flags: ""
            coverage: ""
            package: "gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf"
            host: "arm-linux-gnueabihf"
            secp256k1: ""
            options: "--enable-isystem --build-skip-test-run"

          - image: ubuntu-26.04
            config: "release"
            link: "static"
            cc: "x86_64-w64-mingw32-gcc-posix"
            cxx: "x86_64-w64-mingw32-g++-posix"
            flags: ""
            coverage: ""
            package: "gcc-mingw-w64-x86-64-posix g++-mingw-w64-x86-64-posix"
            host: "x86_64-w64-mingw32"
            secp256k1: ""
            options: "--enable-isystem --build-skip-test-run"

    runs-on: ${{ matrix.image }}

    env:
      CC: '${{ matrix.cc }}'
      CXX: '${{ matrix.cxx }}'
      CFLAGS: '${{ matrix.flags }}'
      CXXFLAGS: '${{ matrix.flags }}'
      QEMU_LD_PREFIX: "${{ matrix.host && format('/usr/{0}', matrix.host) || '' }}"

    steps:
      - name: Get branch name
        id: get-branch
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" == "pull_request" ]; then
            echo "branch=$GITHUB_HEAD_REF" >> $GITHUB_OUTPUT
          else
            echo "branch=$GITHUB_REF_NAME" >> $GITHUB_OUTPUT
          fi

      - name: Checkout repository [libbitcoin-system]
        id: checkout-libbitcoin-system
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          path: 'libbitcoin-system'
          repository: ${{ github.repository }}


      - name: Prepare toolchain [linux]
        if: ${{ startsWith(matrix.image, 'ubuntu') }}
        shell: bash
        run: |
          sudo apt-get update
          if [[ "${{ matrix.package }}" == *"g++-15"* ]] ||
             [[ "${{ matrix.package }}" == *"gcc-15"* ]] ||
             [[ "${{ matrix.package }}" == *"g++-16"* ]] ||
             [[ "${{ matrix.package }}" == *"gcc-16"* ]] ||
             [[ "${{ matrix.package }}" == *"gcc-15-multilib"* ]] ||
             [[ "${{ matrix.package }}" == *"g++-15-multilib"* ]]; then
            sudo add-apt-repository ppa:ubuntu-toolchain-r/test -y
            sudo apt-get update
          fi
          sudo apt-get install git build-essential autoconf automake libtool pkg-config ${{ matrix.package || '' }}
          if [[ "${{ matrix.coverage }}" == "lcov" ]]; then
              sudo apt-get install lcov
          fi

      - name: Prepare toolchain [macos]
        if: ${{ startsWith(matrix.image, 'macos') }}
        shell: bash
        run: |
          brew install autoconf automake libtool ${{ matrix.package || '' }}
          if [[ -n "${{ matrix.llvm }}" ]]; then
              echo "PATH=/opt/homebrew/opt/${{ matrix.llvm }}/bin:${PATH}" >> $GITHUB_ENV
          fi

      - name: Prepare toolchain [windows]
        if: ${{ startsWith(matrix.image, 'windows') }}
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

      - name: Environmental Computation
        shell: bash
        run: |
          if [[ "${{ matrix.link }}" == "dynamic" ]]; then
              echo "LDFLAGS=-Wl,-rpath,${{ github.workspace }}/prefix/lib" >> $GITHUB_ENV
          fi

      - name: Verify emulation [cross]
        if: ${{ matrix.host }}
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          echo 'int main() { return 0; }' > emulation.c
          ${{ matrix.cc }} ${{ matrix.flags }} emulation.c -o emulation
          file emulation
          if [[ "${{ matrix.options }}" != *"--build-skip-tests"* &&   "${{ matrix.options }}" != *"--build-skip-test-run"* ]]; then
            ./emulation
          fi

      - name: Execute installation
        shell: bash
        working-directory: 'libbitcoin-system'
        run: >
          ./builds/gnu/install-gnu.sh
          --build-use-local-src
          --build-src-dir="${{ github.workspace }}"
          --prefix="${{ github.workspace }}/prefix"
          --build-post-install-clean
          --build-obj-dir="obj"
          --build-obj-dir-relative
          --build-config="${{ matrix.config }}"
          --build-link="${{ matrix.link }}"
          ${{ matrix.secp256k1 }}
          ${{ matrix.options }}
          ${{ matrix.host && format('--host={0}', matrix.host) || '' }}

      - name: Coverage calculation
        if: ${{ matrix.coverage == 'lcov' }}
        shell: bash
        working-directory: 'libbitcoin-system'
        run: |
          lcov --ignore-errors version,gcov,mismatch,mismatch --directory . --capture --output-file coverage.info
          lcov --ignore-errors unused --extract coverage.info "${{ github.workspace }}/libbitcoin-system/include/*" "${{ github.workspace }}/libbitcoin-system/src/*" --output-file coverage.info
          lcov --ignore-errors unused --remove coverage.info "${{ github.workspace }}/libbitcoin-system/src/words/catalogs/*" "${{ github.workspace }}/libbitcoin-system/src/crypto/secp256k1/cuda/*" --output-file coverage.info

      - name: Coveralls.io upload
        if: ${{ matrix.coverage == 'lcov' }}
        shell: bash
        working-directory: 'libbitcoin-system'
        env:
          COVERALLS_REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -sLO https://github.com/coverallsapp/coverage-reporter/releases/latest/download/coveralls-linux-x86_64.tar.gz
          curl -sLO https://github.com/coverallsapp/coverage-reporter/releases/latest/download/coveralls-checksums.txt
          grep -F coveralls-linux-x86_64.tar.gz coveralls-checksums.txt | sha256sum -c
          tar -xzf coveralls-linux-x86_64.tar.gz
          ./coveralls report --format lcov coverage.info

      - name: Test artifact collection
        if: failure()
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          if [[ -e "libbitcoin-system/obj/Testing/Temporary/LastTest.log" ]]; then
            cp "libbitcoin-system/obj/Testing/Temporary/LastTest.log" libbitcoin-system-LastTest.errors
          fi
          if [[ -e "libbitcoin-system/obj/test-suite.log" ]]; then
            cp "libbitcoin-system/obj/test-suite.log" libbitcoin-system-test-suite.errors
          fi
          if [[ -e "libbitcoin-system/obj/test.log" ]]; then
            cp "libbitcoin-system/obj/test.log" libbitcoin-system-test.errors
          fi

      - name: Test artifact upload
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: testlogs
          path: ${{ github.workspace }}/*.errors
          retention-days: 1
          if-no-files-found: warn

  cmake:
    if: github.event_name != 'pull_request' || github.event.action != 'closed'

    strategy:
      fail-fast: false

      matrix:
        include:
          - image: macos-latest
            config: "debug"
            link: "dynamic"
            cc: "clang"
            cxx: "clang++"
            flags: ""
            coverage: ""
            secp256k1: ""
            options: ""

          - image: ubuntu-24.04
            config: "debug"
            link: "dynamic"
            cc: "gcc-16"
            cxx: "g++-16"
            flags: ""
            coverage: ""
            package: "g++-16 gcc-16"
            secp256k1: ""
            options: ""

    runs-on: ${{ matrix.image }}

    env:
      CC: '${{ matrix.cc }}'
      CXX: '${{ matrix.cxx }}'
      CFLAGS: '${{ matrix.flags }}'
      CXXFLAGS: '${{ matrix.flags }}'

    steps:
      - name: Get branch name
        id: get-branch
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" == "pull_request" ]; then
            echo "branch=$GITHUB_HEAD_REF" >> $GITHUB_OUTPUT
          else
            echo "branch=$GITHUB_REF_NAME" >> $GITHUB_OUTPUT
          fi

      - name: Checkout repository [libbitcoin-system]
        id: checkout-libbitcoin-system
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          path: 'libbitcoin-system'
          repository: ${{ github.repository }}


      - name: Prepare toolchain [linux]
        if: ${{ startsWith(matrix.image, 'ubuntu') }}
        shell: bash
        run: |
          sudo apt-get update
          if [[ "${{ matrix.package }}" == *"g++-15"* ]] ||
             [[ "${{ matrix.package }}" == *"gcc-15"* ]] ||
             [[ "${{ matrix.package }}" == *"g++-16"* ]] ||
             [[ "${{ matrix.package }}" == *"gcc-16"* ]] ||
             [[ "${{ matrix.package }}" == *"gcc-15-multilib"* ]] ||
             [[ "${{ matrix.package }}" == *"g++-15-multilib"* ]]; then
            sudo add-apt-repository ppa:ubuntu-toolchain-r/test -y
            sudo apt-get update
          fi
          sudo apt-get install git build-essential autoconf automake libtool pkg-config ${{ matrix.package || '' }}
          if [[ "${{ matrix.coverage }}" == "lcov" ]]; then
              sudo apt-get install lcov
          fi

      - name: Prepare toolchain [macos]
        if: ${{ startsWith(matrix.image, 'macos') }}
        shell: bash
        run: |
          brew install autoconf automake libtool ${{ matrix.package || '' }}
          if [[ -n "${{ matrix.llvm }}" ]]; then
              echo "PATH=/opt/homebrew/opt/${{ matrix.llvm }}/bin:${PATH}" >> $GITHUB_ENV
          fi

      - name: Prepare toolchain [windows]
        if: ${{ startsWith(matrix.image, 'windows') }}
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

      - name: Environmental Computation
        shell: bash
        run: |
          if [[ "${{ matrix.link }}" == "dynamic" ]]; then
              echo "LDFLAGS=-Wl,-rpath,${{ github.workspace }}/prefix/lib" >> $GITHUB_ENV
          fi

      - name: Execute installation
        shell: bash
        working-directory: 'libbitcoin-system'
        run: >
          ./builds/cmake/install-cmake.sh
          --build-use-local-src
          --build-src-dir="${{ github.workspace }}"
          --prefix="${{ github.workspace }}/prefix"
          --build-post-install-clean
          --build-obj-dir="obj"
          --build-obj-dir-relative
          --build-config="${{ matrix.config }}"
          --build-link="${{ matrix.link }}"
          ${{ matrix.secp256k1 }}
          ${{ matrix.options }}

      - name: Coverage calculation
        if: ${{ matrix.coverage == 'lcov' }}
        shell: bash
        working-directory: 'libbitcoin-system'
        run: |
          lcov --ignore-errors version,gcov,mismatch,mismatch --directory . --capture --output-file coverage.info
          lcov --ignore-errors unused --extract coverage.info "${{ github.workspace }}/libbitcoin-system/include/*" "${{ github.workspace }}/libbitcoin-system/src/*" --output-file coverage.info
          lcov --ignore-errors unused --remove coverage.info "${{ github.workspace }}/libbitcoin-system/src/words/catalogs/*" "${{ github.workspace }}/libbitcoin-system/src/crypto/secp256k1/cuda/*" --output-file coverage.info

      - name: Coveralls.io upload
        if: ${{ matrix.coverage == 'lcov' }}
        shell: bash
        working-directory: 'libbitcoin-system'
        env:
          COVERALLS_REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -sLO https://github.com/coverallsapp/coverage-reporter/releases/latest/download/coveralls-linux-x86_64.tar.gz
          curl -sLO https://github.com/coverallsapp/coverage-reporter/releases/latest/download/coveralls-checksums.txt
          grep -F coveralls-linux-x86_64.tar.gz coveralls-checksums.txt | sha256sum -c
          tar -xzf coveralls-linux-x86_64.tar.gz
          ./coveralls report --format lcov coverage.info

      - name: Test artifact collection
        if: failure()
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          if [[ -e "libbitcoin-system/obj/Testing/Temporary/LastTest.log" ]]; then
            cp "libbitcoin-system/obj/Testing/Temporary/LastTest.log" libbitcoin-system-LastTest.errors
          fi
          if [[ -e "libbitcoin-system/obj/test-suite.log" ]]; then
            cp "libbitcoin-system/obj/test-suite.log" libbitcoin-system-test-suite.errors
          fi
          if [[ -e "libbitcoin-system/obj/test.log" ]]; then
            cp "libbitcoin-system/obj/test.log" libbitcoin-system-test.errors
          fi

      - name: Test artifact upload
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: testlogs
          path: ${{ github.workspace }}/*.errors
          retention-days: 1
          if-no-files-found: warn

  presets:
    if: github.event_name != 'pull_request' || github.event.action != 'closed'

    strategy:
      fail-fast: false

      matrix:
        include:
          - image: windows-latest
            preset: "win-msvc-release-static"
            cc: ""
            cxx: ""
            flags: ""
            coverage: ""
            secp256k1: ""
            options: ""

          - image: windows-latest
            preset: "win-clangcl-release-static"
            cc: ""
            cxx: ""
            flags: ""
            coverage: ""
            secp256k1: ""
            options: ""

          - image: ubuntu-24.04
            preset: "nix-gnu-debug-static"
            cc: "gcc-13"
            cxx: "g++-13"
            flags: ""
            coverage: ""
            secp256k1: ""
            options: "--build-skip-tests"

    runs-on: ${{ matrix.image }}

    env:
      CC: '${{ matrix.cc }}'
      CXX: '${{ matrix.cxx }}'
      CFLAGS: '${{ matrix.flags }}'
      CXXFLAGS: '${{ matrix.flags }}'

    steps:
      - name: Get branch name
        id: get-branch
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" == "pull_request" ]; then
            echo "branch=$GITHUB_HEAD_REF" >> $GITHUB_OUTPUT
          else
            echo "branch=$GITHUB_REF_NAME" >> $GITHUB_OUTPUT
          fi

      - name: Checkout repository [libbitcoin-system]
        id: checkout-libbitcoin-system
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          path: 'libbitcoin-system'
          repository: ${{ github.repository }}


      - name: Prepare toolchain [linux]
        if: ${{ startsWith(matrix.image, 'ubuntu') }}
        shell: bash
        run: |
          sudo apt-get update
          if [[ "${{ matrix.package }}" == *"g++-15"* ]] ||
             [[ "${{ matrix.package }}" == *"gcc-15"* ]] ||
             [[ "${{ matrix.package }}" == *"g++-16"* ]] ||
             [[ "${{ matrix.package }}" == *"gcc-16"* ]] ||
             [[ "${{ matrix.package }}" == *"gcc-15-multilib"* ]] ||
             [[ "${{ matrix.package }}" == *"g++-15-multilib"* ]]; then
            sudo add-apt-repository ppa:ubuntu-toolchain-r/test -y
            sudo apt-get update
          fi
          sudo apt-get install git build-essential autoconf automake libtool pkg-config ${{ matrix.package || '' }}
          if [[ "${{ matrix.coverage }}" == "lcov" ]]; then
              sudo apt-get install lcov
          fi

      - name: Prepare toolchain [macos]
        if: ${{ startsWith(matrix.image, 'macos') }}
        shell: bash
        run: |
          brew install autoconf automake libtool ${{ matrix.package || '' }}
          if [[ -n "${{ matrix.llvm }}" ]]; then
              echo "PATH=/opt/homebrew/opt/${{ matrix.llvm }}/bin:${PATH}" >> $GITHUB_ENV
          fi

      - name: Prepare toolchain [windows]
        if: ${{ startsWith(matrix.image, 'windows') }}
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

      - name: Environmental Computation
        shell: bash
        run: |
          if [[ "${{ matrix.preset }}" == *shared* ]]; then
              echo "LDFLAGS=-Wl,-rpath,${{ github.workspace }}/prefix/lib" >> $GITHUB_ENV
          fi

      - name: Execute installation
        shell: bash
        working-directory: 'libbitcoin-system'
        run: >
          ./builds/cmake/install-presets.sh
          --build-use-local-src
          --build-src-dir="${{ github.workspace }}"
          --build-preset="${{ matrix.preset }}"
          ${{ matrix.secp256k1 }}
          ${{ matrix.options }}

      - name: Coverage calculation
        if: ${{ matrix.coverage == 'lcov' }}
        shell: bash
        working-directory: 'libbitcoin-system'
        run: |
          lcov --ignore-errors version,gcov,mismatch,mismatch --directory . --capture --output-file coverage.info
          lcov --ignore-errors unused --extract coverage.info "${{ github.workspace }}/libbitcoin-system/include/*" "${{ github.workspace }}/libbitcoin-system/src/*" --output-file coverage.info
          lcov --ignore-errors unused --remove coverage.info "${{ github.workspace }}/libbitcoin-system/src/words/catalogs/*" "${{ github.workspace }}/libbitcoin-system/src/crypto/secp256k1/cuda/*" --output-file coverage.info

      - name: Coveralls.io upload
        if: ${{ matrix.coverage == 'lcov' }}
        shell: bash
        working-directory: 'libbitcoin-system'
        env:
          COVERALLS_REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -sLO https://github.com/coverallsapp/coverage-reporter/releases/latest/download/coveralls-linux-x86_64.tar.gz
          curl -sLO https://github.com/coverallsapp/coverage-reporter/releases/latest/download/coveralls-checksums.txt
          grep -F coveralls-linux-x86_64.tar.gz coveralls-checksums.txt | sha256sum -c
          tar -xzf coveralls-linux-x86_64.tar.gz
          ./coveralls report --format lcov coverage.info

      - name: Test artifact collection
        if: failure()
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          if [[ -e "libbitcoin-system/obj/Testing/Temporary/LastTest.log" ]]; then
            cp "libbitcoin-system/obj/Testing/Temporary/LastTest.log" libbitcoin-system-LastTest.errors
          fi
          if [[ -e "libbitcoin-system/obj/test-suite.log" ]]; then
            cp "libbitcoin-system/obj/test-suite.log" libbitcoin-system-test-suite.errors
          fi
          if [[ -e "libbitcoin-system/obj/test.log" ]]; then
            cp "libbitcoin-system/obj/test.log" libbitcoin-system-test.errors
          fi

      - name: Test artifact upload
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: testlogs
          path: ${{ github.workspace }}/*.errors
          retention-days: 1
          if-no-files-found: warn

  msvc:
    if: github.event_name != 'pull_request' || github.event.action != 'closed'

    strategy:
      fail-fast: false

      matrix:
        include:
          - image: windows-latest
            configuration: "StaticDebug"
            platform: "x64"
            version: "vs2026"
            tests: "*"
            options: ""

          - image: windows-2025-vs2026
            configuration: "StaticRelease"
            platform: "x64"
            version: "vs2026"
            tests: "*"
            options: ""

          - image: windows-latest
            configuration: "StaticRelease"
            platform: "Win32"
            version: "vs2026"
            tests: "*"
            options: ""

          - image: windows-latest
            configuration: "StaticRelease"
            platform: "x64"
            version: "vs2026"
            tests: "*"
            options: "--build-compiler clang"

          - image: windows-11-vs2026-arm
            configuration: "StaticRelease"
            platform: "ARM64"
            version: "vs2026"
            tests: "*"
            options: ""

    runs-on: ${{ matrix.image }}

    steps:
      - name: Get branch name
        id: get-branch
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" == "pull_request" ]; then
            echo "branch=$GITHUB_HEAD_REF" >> $GITHUB_OUTPUT
          else
            echo "branch=$GITHUB_REF_NAME" >> $GITHUB_OUTPUT
          fi

      - name: Set msbuild path
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3
        with:
          msbuild-architecture: ${{ matrix.platform == 'ARM64' && 'arm64' || 'x64' }}

      - name: Checkout repository [libbitcoin-system]
        id: checkout-libbitcoin-system
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          path: 'libbitcoin-system'
          persist-credentials: false
          repository: ${{ github.repository }}

      - name: Force clean nuget package repository
        shell: cmd
        working-directory: 'libbitcoin-system'
        run: |
          nuget locals all -clear

      - name: Execute build
        shell: cmd
        working-directory: 'libbitcoin-system'
        run: >
          .\builds\msvc\build-msvc.cmd
          --build-src-dir "${{ github.workspace }}"
          --build-config ${{ matrix.configuration }}
          --build-platform ${{ matrix.platform }}
          --build-version ${{ matrix.version }}
          --build-use-local-src
          ${{ matrix.options }}

      - name: Execute tests
        shell: powershell
        working-directory: 'libbitcoin-system'
        run: |
          Write-Host "Locating test executables..." -ForegroundColor Yellow;
          $BC_TEST_EXES = @(Get-ChildItem -Path "bin" -recurse | Where-Object { $_.Name -eq "libbitcoin-system-test.exe" });
          If ($BC_TEST_EXES.Count -ne 1) {
            Write-Host "Failure, invalid count of test executables." -ForegroundColor Red;
            exit 1;
          }
          Write-Host "Found single test executable: " $BC_TEST_EXES.FullName -ForegroundColor Green;
          $BC_TEST_SINGLETON = $BC_TEST_EXES.FullName;
          Write-Host "Executing $BC_TEST_SINGLETON" -ForegroundColor Yellow;
          try {
            Invoke-Expression "$BC_TEST_SINGLETON --log_level=warning --run_test=${{ matrix.tests }}"
          }
          catch {
            $ERR = $_;
            Write-Host "Test execution failure: " $ERR -ForegroundColor Red;
            exit $ERR;
          }
          Write-Host "Test execution complete." -ForegroundColor Green;

name: Notify API

on:
  push:
    branches: [master]

permissions: {}

jobs:
  notify-api:
    if: github.repository_owner == 'libbitcoin'
    runs-on: ubuntu-latest

    steps:
      - name: Dispatch to libbitcoin/api
        env:
          GH_TOKEN: ${{ secrets.API_DISPATCH_TOKEN }}
        run: |
          gh api repos/libbitcoin/api/dispatches   -f event_type=library-push   -f "client_payload[repository]=${{ github.repository }}"   -f "client_payload[sha]=${{ github.sha }}"

